# Persistent companions for the Lyam demo host (docs/oci-deploy.md): PostgreSQL (durable
# activation journal + decision audit) and OpenBao (embedded PebbleDB backend; durable plugin/workflow
# secrets). Both join the lyam-net network that the lyam container also uses.
#
# Bring them up ONCE, before the first lyam boot that references them:
#   docker network create lyam-net   # if it does not exist yet
#   PG_PASSWORD=<choose-one> docker compose -f docker-compose.yml up -d
#   sh bao-bootstrap.sh http://127.0.0.1:8200 /opt/lyam/bao-keys
# Then set IAM_PG_URL / IAM_BAO_ADDR / IAM_BAO_TOKEN in /opt/lyam/lyam.env (token from
# /opt/lyam/bao-keys/api-token, never typed into a chat or committed).
#
# This stack only ever CREATES new companion services. It never touches a running lyam
# container, and bao-bootstrap.sh never re-initializes an already-initialized backend.

name: lyam-companions

services:
  pg:
    image: postgres:17-alpine
    container_name: pg
    restart: unless-stopped
    networks: [lyam-net]
    environment:
      POSTGRES_USER: lyam
      POSTGRES_DB: lyam
      # Passed at `docker compose up` time (PG_PASSWORD=... or a local, never-committed .env).
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in the environment or a local .env (never committed)}
    volumes:
      - pg-data:/var/lib/postgresql/data

  bao:
    image: openbao/openbao:2.7.2
    container_name: bao
    restart: unless-stopped
    networks: [lyam-net]
    # Loopback-only on the host: bao-bootstrap.sh and the unseal-at-boot hook use it; the lyam
    # container reaches it over lyam-net as http://bao:8200.
    ports:
      - '127.0.0.1:8200:8200'
    command: server -config=/bao/config/bao.hcl
    volumes:
      # Host path on purpose: update.sh archives this directory (LYAM_BACKUP_BAO_DIR) while the
      # bao container is stopped (LYAM_BACKUP_BAO_CONTAINER=bao).
      - /opt/lyam/bao-storage:/bao/file
      - ./bao.hcl:/bao/config/bao.hcl:ro

volumes:
  pg-data:

networks:
  lyam-net:
    name: lyam-net
