name: Isolated exact-image UI-held controller qualification
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/ui-held-controller-qualification.yml]
permissions: {contents: read, packages: read}
jobs:
  ui_held:
    if: github.head_ref == 'test/ui-held-controller-image310' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Assemble immutable reviewed host controls and qualifier, not a new product image
        env:
          UI_CONTROLS_REF: 87a38fd0e080d2c9ba866f29e32ca53bca18de27
        run: |
          git fetch origin fix/reviewed-ui-held-after-fence fix/qualification-static-diagnostics fix/closed-backup-readback
          git show 87a38fd0e080d2c9ba866f29e32ca53bca18de27:deploy/oci/ordered-queue.py > deploy/oci/ordered-queue.py
          git show 87a38fd0e080d2c9ba866f29e32ca53bca18de27:deploy/oci/reviewed-ui-held.py > deploy/oci/reviewed-ui-held.py
          git show 2dd7d112e99f3d3b2506d770ac1e14874e169026:deploy/oci/qualification.py > deploy/oci/qualification.py
          git show 2dd7d112e99f3d3b2506d770ac1e14874e169026:deploy/oci/qualification-container.mjs > deploy/oci/qualification-container.mjs
          git show 3a51746127893885392b552185ff5306b806e9aa:deploy/oci/update.sh > deploy/oci/update.sh
          git show 07dbc9ba49c4a1a2b02fa53bb04eb50a5f68e441:deploy/oci/closed-recovery-helper.py > deploy/oci/closed-recovery-helper.py
          git show 07dbc9ba49c4a1a2b02fa53bb04eb50a5f68e441:deploy/oci/closed-preflight.sh > deploy/oci/closed-preflight.sh
          git show 07dbc9ba49c4a1a2b02fa53bb04eb50a5f68e441:deploy/oci/closed-launcher.sh > deploy/oci/closed-launcher.sh
          git show 07dbc9ba49c4a1a2b02fa53bb04eb50a5f68e441:deploy/oci/closed-recovery-integrity.py > deploy/oci/closed-recovery-integrity.py
          git show 07dbc9ba49c4a1a2b02fa53bb04eb50a5f68e441:deploy/oci/closed-recovery-call.py > deploy/oci/closed-recovery-call.py
          python3 - <<'PYHASH'
          import hashlib,pathlib
          expected={'ordered-queue.py': 'fd99588bc2570e676ac31c9f49c578fab50c2163c31b88c7c9adef7464235ea1', 'reviewed-ui-held.py': '8056d0fb93e573fff760622af45655481675da4bf618907864572bf90892c1f6', 'qualification.py': 'b7d5a4c3f10b20aa263bdb9cf4fe2077588b3e25f52fb9969d86940685945a90', 'qualification-container.mjs': 'b5fbe294eba1f2d77545fdeac27600b32bfa8cf371f209e025587bfdc962de27', 'update.sh': '239cb278d9549f3e4eeda23fd8b575e40755e0a674327b35696112436078c887', 'closed-recovery-helper.py': '53331b2c6cebc24c95fe25621ae5ec5f9421cf7f4eba075e7b9d584bfcf50ca0', 'closed-preflight.sh': 'e8653def79e375b0e9ebb587d5ff7ddf35c37ea3b5daa23167bbf5c5ef536d91', 'closed-launcher.sh': '5018ef5fdc3efe6758107ce7e664e317f400ec2141268f27c12034d9259a8401', 'closed-recovery-integrity.py': '87f3807890763d4945c857f2ef016a101b1df930289b6fe25e9595364b2ea95d', 'closed-recovery-call.py': 'ad9778bf1f141bfec0c74a0ba49a3c819d999d9470b8c97b5c21048b73c0ee17'}
          for name,want in expected.items():
              assert hashlib.sha256((pathlib.Path('deploy/oci')/name).read_bytes()).hexdigest()==want,name
          PYHASH
      - name: Install isolated browser and native certificate trust
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
          mkdir /tmp/ui-held-pw
          cd /tmp/ui-held-pw
          npm init -y
          npm install playwright-core
      - name: Synthetic exact image, real Docker Caddy controller and SIGKILL rearm
        env:
          CLOSED_IMAGE: ghcr.io/manudss/iam-platform-poc@sha256:310f5b0e20e75a0dbfc5874ae8a45cbe30a44647c3cb5d3e52e9f597d8ab06cc
          NODE_PATH: /tmp/ui-held-pw/node_modules
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_RUN_ID,NODE_PATH unshare --mount --propagation private python3 scripts/ui-held-private-opt.py -- python3 scripts/closed-helper-docker-fixture.py --image "$CLOSED_IMAGE" --helper deploy/oci/closed-recovery-helper.py --preflight deploy/oci/closed-preflight.sh --launcher deploy/oci/closed-launcher.sh --ipv6-mode inactive --ui-held-extension scripts/ui-held-docker-integration.py --out /tmp/ui-held-proof
      - name: Verify shared opt metadata after namespace exits
        if: always()
        run: |
          sudo python3 - <<'PYCHECK'
          import json, pathlib, stat
          out=pathlib.Path('/tmp/ui-held-proof')
          before=json.loads((out/'private-mount-isolation.json').read_text())
          value=pathlib.Path('/opt').stat()
          after={'uid':value.st_uid,'gid':value.st_gid,'mode':oct(stat.S_IMODE(value.st_mode))}
          record={'originalBefore':before['originalBefore'],'originalAfterFixture':after,'unchanged':after==before['originalBefore']}
          (out/'shared-opt-after-fixture.json').write_text(json.dumps(record,indent=2))
          assert record['unchanged'],'shared opt metadata changed'
          # Only empty alias directories created by this wrapper, no unmount or recursive removal.
          for alias in pathlib.Path('/root').glob('ui-held-original-opt-*'):
              if alias.is_dir() and not alias.is_symlink() and not alias.is_mount():
                  alias.rmdir()
          PYCHECK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-image310-ui-held-controller
          path: /tmp/ui-held-proof
          if-no-files-found: error
          retention-days: 7
