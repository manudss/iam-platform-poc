name: oci-readonly-diagnostic

# Manual, read-only diagnostic of the Oracle host. No inputs, no push/PR trigger, fixed scripts only.
# Reuses the four existing SSH secrets unchanged. It never deploys, drains, pauses, restarts or writes on the host.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oci-readonly-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    # Only the reviewed main copy of the scripts may run against the host.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: deploy/oci/readonly-diagnostic
          persist-credentials: false
      - name: Prepare strict SSH
        env:
          OCI_SSH_HOST: ${{ secrets.OCI_DEPLOY_SSH_HOST }}
          OCI_SSH_USER: ${{ secrets.OCI_DEPLOY_SSH_USER }}
          OCI_SSH_KEY: ${{ secrets.OCI_DEPLOY_SSH_KEY }}
          OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          for v in OCI_SSH_HOST OCI_SSH_USER OCI_SSH_KEY OCI_SSH_KNOWN_HOSTS; do
            eval "val=\${$v:-}"
            [ -n "$val" ] || { echo "missing required secret for $v"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/oci_diag
          chmod 600 ~/.ssh/oci_diag
          printf '%s\n' "$OCI_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts_oci_diag
          chmod 600 ~/.ssh/known_hosts_oci_diag
      - name: Host runtime, image, journal, locks (read-only)
        shell: bash
        env:
          OCI_SSH_HOST: ${{ secrets.OCI_DEPLOY_SSH_HOST }}
          OCI_SSH_USER: ${{ secrets.OCI_DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          rc=0
          out="$(timeout 60 ssh -i ~/.ssh/oci_diag -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts_oci_diag" \
            "$OCI_SSH_USER@$OCI_SSH_HOST" 'timeout 55 sudo -n sh -s' < deploy/oci/readonly-diagnostic/host.sh)" || rc=$?
          printf '%s\n' "$out" | head -c 20000
          [ "$rc" -eq 0 ] || { echo "host step failed (ssh/remote exit $rc)"; exit 1; }
          printf '%s\n' "$out" | grep -qx 'diag.complete=true' || { echo "host output incomplete"; exit 1; }
      - name: Aggregated backlog inventory (read-only, counts only)
        shell: bash
        env:
          OCI_SSH_HOST: ${{ secrets.OCI_DEPLOY_SSH_HOST }}
          OCI_SSH_USER: ${{ secrets.OCI_DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          rc=0
          out="$(timeout 60 ssh -i ~/.ssh/oci_diag -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts_oci_diag" \
            "$OCI_SSH_USER@$OCI_SSH_HOST" 'timeout 55 sudo -n docker exec -i -w /app/api lyam node -' < deploy/oci/readonly-diagnostic/inventory.cjs)" || rc=$?
          printf '%s\n' "$out" | head -c 17000
          [ "$rc" -eq 0 ] || { echo "inventory failed or incomplete (exit $rc; 3 = partial/unknown, output above)"; exit 1; }
          printf '%s\n' "$out" | grep -q '"complete":true' || { echo "inventory not complete"; exit 1; }
      - name: Remove key material
        if: always()
        run: rm -f ~/.ssh/oci_diag ~/.ssh/known_hosts_oci_diag
