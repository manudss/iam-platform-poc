# Runs on every PR (drafts included, re-run when marked ready) so the checks show on the PR page, and on demand
# via Actions > ci > Run workflow. A push on a PR cancels that PR's previous run.
# The repo is public: GitHub-hosted standard runners are free for public repos. Jobs stay capped with timeout-minutes.
# The api job downloads the real service binaries and runs the real-service suites (see the job comment and docs/e2e.md).
# The core binary IS built, so the Rust-core end-to-end suite runs. The compose job starts the real docker-compose stack on the
# runner (Docker is preinstalled there; images are pulled from public registries, no paid service) and runs apps/api/src/compose.e2e.spec.ts (container checks) and compose-app.e2e.spec.ts (application path: Dolt -> activation -> core over gRPC -> durable bus -> consumer on the containers).
name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install nats-server (core bus end-to-end tests run against a real server)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.15.2 -R nats-io/nats-server -p 'nats-server-v2.15.2-linux-amd64.tar.gz' -D /tmp/nats
          tar xzf /tmp/nats/nats-server-*.tar.gz -C /tmp/nats
          echo "NATS_SERVER_BIN=$(find /tmp/nats -name nats-server -type f | head -1)" >> $GITHUB_ENV
          echo "IAM_REQUIRE_NATS=1" >> $GITHUB_ENV
      - run: cargo test --locked
        working-directory: core
      # Policy-studio step 2: the schema checks run inside cargo test above; this named step makes a schema
      # failure obvious in the run summary (the demo rules are validated against policies/demo.cedarschema).
      - name: Validate the Cedar rules against their schema
        run: cargo test --locked -p iam-decision -p iam-core schema
        working-directory: core
  api:
    # Integration job: installs the real service binaries from their GitHub releases (free, no Docker) so the real-service suites RUN
    # instead of skipping: Dolt, PostgreSQL (embedded-postgres npm package), NATS JetStream, OpenBao, Temporal dev server, plus the
    # Rust core and a headless-Chrome UI run. If a download fails the step prints the release assets and fails the job.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Event circuit inventory guard
        run: node scripts/event-inventory.mjs --check
      - run: cargo build -p iam-core --locked
        working-directory: core
      - name: Install service binaries
        run: |
          mkdir -p /tmp/svc && cd /tmp/svc
          dl() { gh release download "$2" -R "$1" -p "$3" -D /tmp/svc --clobber || { echo "download failed: $1 $2 $3"; gh release view "$2" -R "$1" --json assets -q '.assets[].name'; exit 1; }; }
          dl dolthub/dolt v2.6.1 'dolt-linux-amd64.tar.gz'
          dl nats-io/nats-server v2.15.2 'nats-server-v2.15.2-linux-amd64.tar.gz'
          # asset names of these two are matched on the release's own asset list (linux + amd64/x86_64 tarball, no hsm/sbom/sig/ui)
          pick() { n=$(gh release view "$2" -R "$1" --json assets -q '.assets[].name' | grep -iE 'linux' | grep -iE '(amd64|x86_64)\.tar\.gz$' | grep -viE 'hsm|sbom|sig|ui' | head -1); echo "$1 -> $n"; test -n "$n" && dl "$1" "$2" "$n" || { gh release view "$2" -R "$1" --json assets -q '.assets[].name' | grep -i linux; exit 1; }; }
          pick openbao/openbao v2.7.2
          pick temporalio/cli v1.9.1
          mkdir dolt nats bao temporal
          tar xzf dolt-linux-amd64.tar.gz -C dolt; tar xzf nats-server-*.tar.gz -C nats; tar xzf openbao_*.tar.gz -C bao; tar xzf temporal_*.tar.gz -C temporal
          echo "DOLT_BIN=$(find /tmp/svc/dolt -name dolt -type f | head -1)" >> $GITHUB_ENV
          echo "NATS_SERVER_BIN=$(find /tmp/svc/nats -name nats-server -type f | head -1)" >> $GITHUB_ENV
          echo "BAO_BIN=$(find /tmp/svc/bao -name bao -type f | head -1)" >> $GITHUB_ENV
          echo "TEMPORAL_BIN=$(find /tmp/svc/temporal -name temporal -type f | head -1)" >> $GITHUB_ENV
          mkdir /tmp/pgtry && cd /tmp/pgtry && npm init -y >/dev/null && npm i embedded-postgres >/dev/null
          echo "PG_BIN=/tmp/pgtry/node_modules/@embedded-postgres/linux-x64/native/bin" >> $GITHUB_ENV
      - name: Check every binary is really there
        run: |
          for v in DOLT_BIN NATS_SERVER_BIN BAO_BIN TEMPORAL_BIN; do p="${!v}"; test -x "$p" && echo "$v=$p" || { echo "$v missing"; exit 1; }; done
          test -x "$PG_BIN/postgres"
      - name: Plugin dev signing keys (explicit dev setup, P0-3)
        run: node scripts/plugin-dev-setup.mjs
      - name: Install the API dependencies (first - the host-provided plugin packages symlink into them)
        run: npm ci
        working-directory: apps/api
      - name: Plugin shared dependencies (step 4 - the controlled install the plugins resolve against)
        run: npm ci && node scripts/plugin-deps.mjs && node scripts/plugin-deps.mjs --check
      - run: node --test scripts/saml-signatures.test.mjs
      - run: npm test
        working-directory: apps/api
      - name: SSO session integration (two applications and expiration)
        run: node --test scripts/sso-session.test.mjs
      - name: Browser UI end-to-end (headless Chrome, real Dolt + core + API + ng serve)
        env:
          NG_CLI_ANALYTICS: "false"
        run: |
          (cd apps/web && npm ci)
          mkdir /tmp/pw && (cd /tmp/pw && npm init -y >/dev/null && npm i playwright-core >/dev/null)
          CHROME_BIN=$(command -v google-chrome) NODE_PATH=/tmp/pw/node_modules node scripts/ui-e2e.mjs /tmp/ui-shots
      - name: Branding browser end-to-end (production SSR, real Dolt and Apply)
        run: |
          (cd apps/web && npm run build)
          CHROME_BIN=$(command -v google-chrome) NODE_PATH=/tmp/pw/node_modules node scripts/branding-e2e.mjs /tmp/branding-shots
      - name: Connections UI safety (real bundle, isolated API fixtures, light/dark desktop/mobile)
        run: NODE_PATH=/tmp/pw/node_modules node scripts/workflow-connections-ui-e2e.cjs /tmp/workflow-connections-shots
      - name: Workflow tag overflow and placeholder hover (isolated API fixtures)
        run: NODE_PATH=/tmp/pw/node_modules node scripts/workflow-visual-fixes-e2e.cjs /tmp/workflow-visual-fixes
      - name: Workflow logic ports (isolated API fixtures)
        run: NODE_PATH=/tmp/pw/node_modules node scripts/workflow-logic-ports-e2e.cjs /tmp/workflow-logic-ports
      - name: Browser sign-in flow end-to-end (headless Chrome, real core, local client on localhost:4200)
        run: CHROME_BIN=$(command -v google-chrome) NODE_PATH=/tmp/pw/node_modules node scripts/authz-browser-e2e.mjs /tmp/authz-shots
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm test -- --watch=false
        working-directory: apps/web
      - name: Demo edge framing policy (only /login?preview=1 may be framed)
        run: node --test demo/frame-policy.test.mjs demo/warm-signin.test.mjs
      - name: Demo edge routing (the whole /authorize surface, incl. the passkey script, reaches the core)
        run: node --test demo/server.test.mjs
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Start the compose stack (local-only dev credentials from .env.example)
        run: |
          cp .env.example .env
          docker compose --env-file .env -f infra/docker-compose.yml up -d
      - name: Wait for ports
        run: |
          for p in 3307 5433 4222 8200 7233; do
            ok=0; for i in $(seq 1 90); do (echo > /dev/tcp/127.0.0.1/$p) 2>/dev/null && { ok=1; break; }; sleep 2; done
            echo "port $p open=$ok"; [ $ok = 1 ] || { docker compose -f infra/docker-compose.yml ps; docker compose -f infra/docker-compose.yml logs --tail=100; exit 1; }
          done
          sleep 15
      - name: Plugin dev signing keys (explicit dev setup, P0-3)
        run: node scripts/plugin-dev-setup.mjs
      - name: Build the Rust core (runs as a local process next to the containers, gRPC enabled by the test)
        run: cargo build -p iam-core --locked
        working-directory: core
      - name: Install and build the API (first - the host-provided plugin packages symlink into its node_modules)
        working-directory: apps/api
        run: npm ci && npm run build
      - name: Plugin shared dependencies (step 4)
        run: npm ci && node scripts/plugin-deps.mjs && node scripts/plugin-deps.mjs --check
      - name: Run compose end-to-end suites (container checks, then the application path on the containers)
        working-directory: apps/api
        run: |
          COMPOSE_STACK=1 node --test dist/compose.e2e.spec.js
          COMPOSE_STACK=1 node --test dist/compose-app.e2e.spec.js
      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml ps; docker compose -f infra/docker-compose.yml logs --tail=150
      - name: Stop
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
  demo-docker:
    # Step 7: every PR proves the all-in-one demo image still builds and boots (docs/demo.md).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build the demo image (build context = repository root)
        run: docker build -f demo/Dockerfile -t iam-demo:ci .
      - name: Boot it and wait for the API health check
        run: |
          docker run -d --name iam-demo-ci -p 8080:8080 iam-demo:ci
          ok=0; for i in $(seq 1 90); do code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz || true); [ "$code" = 200 ] && { ok=1; break; }; sleep 2; done
          echo "healthz ok=$ok"; [ $ok = 1 ] || { docker logs iam-demo-ci --tail=150; exit 1; }
          # /healthz is the EDGE answering; the API must also be alive behind it (proxy /api -> :3000).
          ok=0; for i in $(seq 1 30); do code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/health || true); [ "$code" = 200 ] && { ok=1; break; }; sleep 2; done
          echo "api health ok=$ok"; [ $ok = 1 ] || { docker logs iam-demo-ci --tail=150; exit 1; }
          # A healthy API is still not enough: the sign-in must work through the plugin bus. The Render preview
          # once booted with entry answering but every authenticate failing behind the gate budgets. Start a
          # chain through the edge, then complete a full demo login (fictional account, docs/demo.md).
          CHAL=$(printf ci-demo-challenge | sha256sum | cut -d' ' -f1 | xxd -r -p | base64 | tr '+/' '-_' | tr -d '=')
          code=$(curl -s -o /tmp/entry.html -w '%{http_code}' "http://127.0.0.1:8080/core/authorize?client_id=demo-web&redirect_uri=http%3A%2F%2Flocalhost%3A8080%2Fcallback&response_type=code&state=ci&code_challenge=$CHAL&code_challenge_method=S256&chain=password-only")
          echo "chain start http=$code"; [ "$code" = 200 ] || { docker logs iam-demo-ci --tail=150; exit 1; }
          body=$(curl -s -w '\n%{http_code}' -X POST http://127.0.0.1:8080/core/authorize -H 'content-type: application/json' -d "{\"client_id\":\"demo-web\",\"redirect_uri\":\"http://localhost:8080/callback\",\"code_challenge\":\"$CHAL\",\"username\":\"demo-alice\",\"password\":\"demo-only-not-a-secret\"}")
          echo "login answer: $body"
          [ "$(echo "$body" | tail -1)" = 200 ] || { docker logs iam-demo-ci --tail=150; exit 1; }
          echo "$body" | head -n -1 | grep -q '"code"' || { docker logs iam-demo-ci --tail=150; exit 1; }
      - name: Gallery browser end-to-end (real seeded demo, desktop and mobile)
        run: |
          mkdir -p /tmp/gallery-pw
          npm install --prefix /tmp/gallery-pw playwright-core
          NODE_PATH=/tmp/gallery-pw/node_modules CHROME_BIN=$(command -v google-chrome) node scripts/gallery-e2e.mjs http://localhost:8080 /tmp/gallery-shots
      - name: Gallery screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-screenshots
          path: /tmp/gallery-shots
          if-no-files-found: ignore
      - name: Container logs on failure
        if: failure()
        run: docker logs iam-demo-ci --tail=150
      - name: Stop
        if: always()
        run: docker rm -f iam-demo-ci || true
