name: PR Previews

# SECURITY MODEL
# - pull_request_target: this file and scripts/render-pr-previews.mjs are read from the BASE branch.
#   issue_comment and workflow_dispatch runs also execute the DEFAULT branch version:
#   a PR can never change this code to read the secrets.
# - The PR code is NEVER checked out nor executed here.
# - The head branch/sha a deploy builds are read back from the GitHub API by the script,
#   never taken from event metadata. PRs from forks are refused.
# - `/preview` only works from a comment by an OWNER/MEMBER/COLLABORATOR.
# - The PR code is built into an image by the untrusted-side demo-image workflow; the preview service only gets IAM_PUBLIC_ORIGIN (not a secret).
#   Infra secrets (RENDER_API_KEY) stay in this trusted workflow and never reach the preview service.
#
# COST MODEL (free tiers only) - DEPLOY ON DEMAND, PREBUILT IMAGES
# - The Docker image is built on GitHub-hosted runners (workflow "Demo image (GHCR)",
#   free on this public repo) and pushed to GHCR. Render only PULLS and starts it:
#   no Render build at all, so the workspace's 500 free build pipeline minutes/month
#   are untouched (exhaustion used to block every build until the monthly reset,
#   observed 2026-10-30, PR #7) and a demand takes ~1-3 min instead of ~10-20.
# - The preview deploys only on explicit demand: a `/preview` comment on the PR, or
#   Actions > PR Previews > Run workflow. One free Render web service per PR
#   (image-backed, 0.1 CPU / 512 MB, spins down after 15 min idle), created on the
#   first demand in the "dev" environment, deleted when the PR closes.
# - GitHub-hosted minutes: ensure/cleanup take a few seconds per event; a refresh job holds
#   a runner while it waits for the image build (rare: the pull_request trigger usually
#   pre-builds it) and then the Render pull+start. Public repo: runners are free.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number whose preview should be (re)deployed
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write # backstop: dispatch the demo-image build when a commit's image is missing

concurrency:
  group: pr-previews-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  ensure:
    name: Update the preview status comment (no deploy)
    if: github.event_name == 'pull_request_target' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the default branch (trusted code)
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Maintain the preview status comment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/render-pr-previews.mjs ensure

  refresh-comment:
    name: Deploy the preview on demand (/preview comment)
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/preview') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out the default branch (trusted code)
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Deploy the preview on the latest PR commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
          RENDER_ENVIRONMENT_ID: ${{ vars.RENDER_ENVIRONMENT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/render-pr-previews.mjs refresh

  refresh-manual:
    name: Deploy the preview on demand (manual dispatch)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out the default branch (trusted code)
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Deploy the preview on the latest PR commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
          RENDER_ENVIRONMENT_ID: ${{ vars.RENDER_ENVIRONMENT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
        run: node scripts/render-pr-previews.mjs refresh

  cleanup:
    name: Delete the preview
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the default branch (trusted code)
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Delete the Render preview service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/render-pr-previews.mjs cleanup
