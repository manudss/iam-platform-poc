name: PR Previews

# SECURITY MODEL
# - pull_request_target: this file and scripts/render-pr-previews.mjs are read from the BASE branch.
#   issue_comment and workflow_dispatch runs also execute the DEFAULT branch version:
#   a PR can never change this code to read the secrets.
# - The PR code is NEVER checked out nor executed here.
# - The head branch/sha a deploy builds are read back from the GitHub API by the script,
#   never taken from event metadata. PRs from forks are refused.
# - `/preview` only works from a comment by an OWNER/MEMBER/COLLABORATOR.
# - Render builds the PR code itself; the preview service only gets IAM_PUBLIC_ORIGIN (not a secret).
#   Infra secrets (RENDER_API_KEY) stay in this trusted workflow and never reach the preview service.
#
# COST MODEL (free tiers only) - DEPLOY ON DEMAND
# - A push on a PR branch starts NO Render build. Each Docker build costs ~10-20 of the
#   500 free pipeline minutes/month shared by the workspace; exhaustion blocks every
#   build until the monthly reset (observed 2026-10-30, PR #7).
# - The preview builds only on explicit demand: a `/preview` comment on the PR, or
#   Actions > PR Previews > Run workflow. One free Render web service per PR
#   (Docker, 0.1 CPU / 512 MB, spins down after 15 min idle), created on the first
#   demand in the "dev" environment, deleted when the PR closes.
# - GitHub-hosted minutes: a few seconds per event (Node script only, no build on the runner).
on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number whose preview should be (re)deployed
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-previews-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  ensure:
    name: Update the preview status comment (no deploy)
    if: github.event_name == 'pull_request_target' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out BASE branch only
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Maintain the preview status comment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/render-pr-previews.mjs ensure

  refresh-comment:
    name: Deploy the preview on demand (/preview comment)
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/preview') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the default branch (trusted code)
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Deploy the preview on the latest PR commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
          RENDER_ENVIRONMENT_ID: ${{ vars.RENDER_ENVIRONMENT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/render-pr-previews.mjs refresh

  refresh-manual:
    name: Deploy the preview on demand (manual dispatch)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the default branch (trusted code)
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Deploy the preview on the latest PR commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
          RENDER_ENVIRONMENT_ID: ${{ vars.RENDER_ENVIRONMENT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
        run: node scripts/render-pr-previews.mjs refresh

  cleanup:
    name: Delete the preview
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out BASE branch only
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Delete the Render preview service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/render-pr-previews.mjs cleanup
