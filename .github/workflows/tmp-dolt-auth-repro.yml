# TEMPORARY reproduction (deleted before merge): proves, on the exact dolt-sql-server:latest
# image, (1) that root credentials freeze at first initialization of the data directory, (2) the
# exact server error a later mismatched DOLT_ROOT_PASSWORD produces, (3) that the read-only probe
# (infra/dev/dolt-probe.mjs) discriminates the accepted credential, and (4) whether the
# volume-preserving repair (direct `dolt sql` while the server is stopped) works.
name: tmp-dolt-auth-repro
on: push
permissions: { contents: read }
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install the API dependencies (mysql2 for the probe)
        run: npm ci --no-audit --no-fund --prefix apps/api
      - name: First generation of the volume (password A)
        run: |
          set -eux
          docker volume create repro-dolt-auth
          docker run -d --name dolt1 -p 127.0.0.1:3306:3306 \
            -e DOLT_ROOT_PASSWORD=password-generation-A -e DOLT_ROOT_HOST='%' \
            -v repro-dolt-auth:/var/lib/dolt dolthub/dolt-sql-server:latest
          for i in $(seq 1 60); do
            if DOLT_HOST=127.0.0.1 DOLT_PORT=3306 DOLT_PASSWORD=password-generation-A \
               node infra/dev/dolt-probe.mjs | grep -q 'ACCEPTED: the password from your .env'; then exit 0; fi
            sleep 2
          done
          echo 'server never accepted generation-A password' >&2; exit 1
      - name: "Second generation (password B), same volume: frozen credential expected"
        run: |
          set -eux
          docker rm -f dolt1
          docker run -d --name dolt2 -p 127.0.0.1:3306:3306 \
            -e DOLT_ROOT_PASSWORD=password-generation-B -e DOLT_ROOT_HOST='%' \
            -v repro-dolt-auth:/var/lib/dolt dolthub/dolt-sql-server:latest
          for i in $(seq 1 60); do
            if DOLT_HOST=127.0.0.1 DOLT_PORT=3306 DOLT_PASSWORD=password-generation-A \
               node infra/dev/dolt-probe.mjs | tee /tmp/probe-A.txt | grep -q 'ACCEPTED: the password from your .env'; then break; fi
            sleep 2
          done
          grep -q 'ACCEPTED: the password from your .env' /tmp/probe-A.txt   # the FROZEN generation-A credential still rules
          DOLT_HOST=127.0.0.1 DOLT_PORT=3306 DOLT_PASSWORD=password-generation-B \
            node infra/dev/dolt-probe.mjs | tee /tmp/probe-B.txt
          grep -q 'REFUSED: the password from your .env' /tmp/probe-B.txt    # generation-B password rejected
          grep -qi 'Access denied' /tmp/probe-B.txt                          # the exact error family the API hit
      - name: Read the stored accounts directly (server stopped, no auth needed)
        run: |
          docker rm -f dolt2
          docker run --rm --entrypoint dolt -w /var/lib/dolt -v repro-dolt-auth:/var/lib/dolt \
            dolthub/dolt-sql-server:latest sql -q "SELECT User, Host FROM mysql.user;"
      - name: "Strict read-only check: SELECT over a :ro mount of the datadir"
        run: |
          set -eux
          docker run --rm --entrypoint dolt -w /var/lib/dolt -v repro-dolt-auth:/var/lib/dolt:ro \
            dolthub/dolt-sql-server:latest sql -q "SELECT User, Host FROM mysql.user;"
      - name: "Backup before repair: archive the stopped server's data dir with its own image"
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/dolt-backup"
          docker run --rm --entrypoint tar -v repro-dolt-auth:/var/lib/dolt:ro -v "$RUNNER_TEMP/dolt-backup:/backup" \
            dolthub/dolt-sql-server:latest \
            czf /backup/dolt-data-backup.tgz -C /var/lib/dolt .
          tar tzf "$RUNNER_TEMP/dolt-backup/dolt-data-backup.tgz" | tee /tmp/backup-listing.txt | head -5
          grep -q 'privileges.db' /tmp/backup-listing.txt   # the credential store is in the backup
      - name: "Volume-preserving repair attempt: align the stored root password while stopped"
        run: |
          set -eux
          docker run --rm --entrypoint dolt -w /var/lib/dolt -v repro-dolt-auth:/var/lib/dolt \
            dolthub/dolt-sql-server:latest sql -q "ALTER USER 'root'@'%' IDENTIFIED BY 'password-generation-B';"
          docker run -d --name dolt3 -p 127.0.0.1:3306:3306 \
            -e DOLT_ROOT_PASSWORD=password-generation-B -e DOLT_ROOT_HOST='%' \
            -v repro-dolt-auth:/var/lib/dolt dolthub/dolt-sql-server:latest
          for i in $(seq 1 60); do
            if DOLT_HOST=127.0.0.1 DOLT_PORT=3306 DOLT_PASSWORD=password-generation-B \
               node infra/dev/dolt-probe.mjs | tee /tmp/probe-after.txt | grep -q 'ACCEPTED: the password from your .env'; then exit 0; fi
            sleep 2
          done
          echo 'repair failed: generation-B password still not accepted' >&2; exit 1
      - name: Cleanup
        if: ${{ always() }}
        run: |
          docker rm -f dolt1 dolt2 dolt3 2>/dev/null || true
          docker volume rm repro-dolt-auth 2>/dev/null || true
          # kept: $RUNNER_TEMP/dolt-backup (throwaway runner copy, dies with the runner)

  fresh-install:
    # First-launch scenario: does a FRESH volume initialized through the real compose path
    # (current compose files + .env.example values) accept the .env password? And what does a
    # first init WITHOUT any env freeze? Gates any reset advice: a reset that reproduces 1045
    # on a fresh volume would be useless.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install the API dependencies (mysql2 for the probe)
        run: npm ci --no-audit --no-fund --prefix apps/api
      - name: "Fresh volume, real compose path, .env present: the .env password must be accepted"
        run: |
          set -eux
          cp .env.example .env
          PW=$(grep '^DOLT_ROOT_PASSWORD=' .env | cut -d= -f2-)
          docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up -d dolt
          ok=0
          for i in $(seq 1 60); do
            if DOLT_HOST=127.0.0.1 DOLT_PORT=3307 DOLT_PASSWORD="$PW" \
               node infra/dev/dolt-probe.mjs | tee /tmp/probe-fresh.txt | grep -q 'ACCEPTED: the password from your .env'; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo 'FRESH INSTALL REFUSES the .env password: a reset would NOT fix the user' >&2; exit 1; }
      - name: "Scoped reset itself: compose down -v must remove only this project's resources"
        run: |
          set -eux
          docker volume ls --filter label=com.docker.compose.project --format '{{.Name}} {{.Labels}}' | tee /tmp/vols-before.txt
          docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.dev.yml down -v
          # every compose-managed volume of this project is gone, nothing else was touched
          ! docker volume ls --filter label=com.docker.compose.project=tmp-dolt-auth-repro --format '{{.Name}}' | grep .
          docker volume ls --format '{{.Name}}' | tee /tmp/vols-after.txt
      - name: "Re-init after reset through the same compose path: accepted again"
        run: |
          set -eux
          PW=$(grep '^DOLT_ROOT_PASSWORD=' .env | cut -d= -f2-)
          docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up -d dolt
          for i in $(seq 1 60); do
            if DOLT_HOST=127.0.0.1 DOLT_PORT=3307 DOLT_PASSWORD="$PW" \
               node infra/dev/dolt-probe.mjs | grep -q 'ACCEPTED: the password from your .env'; then exit 0; fi
            sleep 2
          done
          echo 're-init after reset did not accept the .env password' >&2; exit 1
      - name: "Characterize a first init with NO env at all (plain docker run, empty environment)"
        run: |
          set -eux
          docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.dev.yml down -v
          docker volume create noenv-vol
          docker run -d --name dolt-noenv -p 127.0.0.1:3306:3306 -v noenv-vol:/var/lib/dolt dolthub/dolt-sql-server:latest
          sleep 8
          DOLT_HOST=127.0.0.1 DOLT_PORT=3306 DOLT_PASSWORD=some-attempt node infra/dev/dolt-probe.mjs | tee /tmp/probe-noenv.txt || true
          docker rm -f dolt-noenv
          docker run --rm --entrypoint dolt -w /var/lib/dolt -v noenv-vol:/var/lib/dolt \
            dolthub/dolt-sql-server:latest sql -q "SELECT User, Host FROM mysql.user;"
      - name: Cleanup
        if: ${{ always() }}
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.dev.yml down -v 2>/dev/null || true
          docker rm -f dolt-noenv 2>/dev/null || true
          docker volume rm noenv-vol 2>/dev/null || true
