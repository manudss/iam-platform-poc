# Un serveur partagé : un compte par projet, JetStream avec quotas par compte.
port: 4445
jetstream { store_dir: "/tmp/js-spike-acc" }
accounts {
  IAM:   { jetstream: { max_mem: 16MB, max_file: 64MB, max_streams: 5, max_consumers: 20 }
           users: [ { user: iam, password: iam } ] }
  OTHER: { jetstream: { max_mem: 8MB, max_file: 8MB, max_streams: 2, max_consumers: 2 }
           users: [ { user: other, password: other } ] }
}
