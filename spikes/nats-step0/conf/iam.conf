# Spike étape 0 : un utilisateur NATS par plugin, droits minimaux, JetStream actif.
# Mots de passe jetables, uniquement pour le test local.
port: 4444
http: 8444
jetstream { store_dir: "/tmp/js-spike", max_mem_store: 64MB, max_file_store: 256MB }
authorization {
  users = [
    { user: core, password: core, permissions: { publish: ">", subscribe: ">" } }
    # plugin a, b : répondent ; c : muet ; d : trop lent. Émission = sujet d'entrée du core uniquement.
    { user: a, password: a, permissions: {
        publish: { allow: ["core.in.a"] }
        subscribe: { allow: ["plugin.a.call", "_INBOX.a.>"] }
        allow_responses: { max: 1, expires: "5s" } } }
    { user: b, password: b, permissions: {
        publish: { allow: ["core.in.b"] }
        subscribe: { allow: ["plugin.b.call", "_INBOX.b.>"] }
        allow_responses: { max: 1, expires: "5s" } } }
    { user: c, password: c, permissions: {
        publish: { allow: ["core.in.c"] }
        subscribe: { allow: ["plugin.c.call", "_INBOX.c.>"] }
        allow_responses: { max: 1, expires: "5s" } } }
    { user: d, password: d, permissions: {
        publish: { allow: ["core.in.d"] }
        subscribe: { allow: ["plugin.d.call", "_INBOX.d.>"] }
        allow_responses: { max: 1, expires: "5s" } } }
    # plugin mail e1, e2 : consommateurs JetStream (pull) du flux EVT, consommateur durable partagé "mail".
    { user: e1, password: e1, permissions: {
        publish: { allow: ["$JS.API.CONSUMER.INFO.EVT.mail", "$JS.API.CONSUMER.MSG.NEXT.EVT.mail", "$JS.ACK.EVT.mail.>"] }
        subscribe: { allow: ["_INBOX.e1.>"] } } }
    { user: e2, password: e2, permissions: {
        publish: { allow: ["$JS.API.CONSUMER.INFO.EVT.mail", "$JS.API.CONSUMER.MSG.NEXT.EVT.mail", "$JS.ACK.EVT.mail.>"] }
        subscribe: { allow: ["_INBOX.e2.>"] } } }
  ]
}
