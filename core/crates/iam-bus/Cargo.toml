[package]
name = "iam-bus"
version = "0.1.0"
edition = "2024"
description = "Event bus of the Rust core (step 1): envelope, catalogue, subscriptions, dispatcher, transports (in-process and NATS)."

[dependencies]
async-nats = "0.51"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync"] }
tracing = "0.1.44"
iam-plugin-runtime = { path = "../iam-plugin-runtime" }

[dev-dependencies]
wat = "1"
tokio = { version = "1.54.1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
