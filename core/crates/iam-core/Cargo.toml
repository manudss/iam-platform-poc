[package]
name = "iam-core"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[dependencies]
tonic = "0.12"
prost = "0.13"
axum = "0.8.9"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
iam-idp = { path = "../iam-idp" }
iam-decision = { path = "../iam-decision" }
iam-plugin-runtime = { path = "../iam-plugin-runtime" }
iam-bus = { path = "../iam-bus" }
async-nats = "0.51"
async-trait = "0.1"
sha2 = "0.10"
base64 = "0.22"
tokio-stream = { version = "0.1", features = ["net"] }

[dependencies.wat]
version = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[build-dependencies]
tonic-build = "0.12"
protox = "0.7"
