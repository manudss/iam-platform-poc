<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>lyam</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/favicon-180.png">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Applies the color theme before first paint (same rule as theme.ts): a remembered choice wins, else the system preference.
    try {
      var m = localStorage.getItem('iam.theme');
      if (m !== 'light' && m !== 'dark') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = m;
    } catch (e) { /* storage blocked: the light default in styles.css applies */ }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
