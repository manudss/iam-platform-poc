# Local NATS for the core bus. Development passwords only: never reuse outside a local run.
# Step 3: Notify deliveries are JetStream (stream IAM_BUS_EVENTS, subjects bus.events.<address>); consumers
# manage their durable pull consumer ($JS.API.CONSUMER.>) and receive on their custom inbox.
# One NATS user per subscriber, minimal rights (measured in docs/spikes/etape0-nats.md, PR #13).
# Subjects: the core calls plugin.<id>.call; a subscriber publishes only core.in.<id>.
# The API's JetStream stream IAM_EVENTS (iam.>) is separate and untouched.
listen: 127.0.0.1:4222
server_name: iam-local
jetstream { store_dir: "/tmp/iam-nats-js", max_mem_store: 64MB, max_file_store: 256MB }
authorization {
  users = [
    # the core (bus owner). The existing API NATS client does not authenticate today, so no API user is defined here.
    { user: core, password: core-dev, permissions: { publish: ">", subscribe: ">" } }
    # demo subscribers used by the e2e tests (a: answers, b: answers, c: silent)
    { user: sub-a, password: sub-a, permissions: { publish: { allow: ["core.in.sub-a", "$JS.API.CONSUMER.>"] }, subscribe: { allow: ["plugin.sub-a.call", "_INBOX.sub-a.>"] }, allow_responses: { max: 1, expires: "5s" } } }
    { user: sub-b, password: sub-b, permissions: { publish: { allow: ["core.in.sub-b", "$JS.API.CONSUMER.>"] }, subscribe: { allow: ["plugin.sub-b.call", "_INBOX.sub-b.>"] }, allow_responses: { max: 1, expires: "5s" } } }
    { user: sub-c, password: sub-c, permissions: { publish: { allow: ["core.in.sub-c", "$JS.API.CONSUMER.>"] }, subscribe: { allow: ["plugin.sub-c.call", "_INBOX.sub-c.>"] }, allow_responses: { max: 1, expires: "5s" } } }
    # Step 2/3: the API plugin host. It receives the calls for every plugin it serves (plugin.>) and only answers them
    # (allow_responses covers the reply to the core's inbox). It can never publish an event itself: emission goes
    # through the core's HTTP API, which checks the emission grants and stamps the source. Step 3: it manages its
    # durable consumers ($JS.API.CONSUMER.>) and reads/writes the effect-ledger KV bucket ($KV.iam-effects.>; reads
    # are direct gets). It cannot create streams or touch other buckets.
    { user: api-host, password: api-host-dev, permissions: { publish: { allow: ["core.in.api-host", "$JS.API.CONSUMER.>", "$JS.API.INFO", "$JS.API.STREAM.INFO.KV_iam-effects", "$JS.API.DIRECT.GET.>", "$KV.iam-effects.>"] }, subscribe: { allow: ["plugin.>", "_INBOX.api-host.>"] }, allow_responses: { max: 10, expires: "5s" } } }
  ]
}
