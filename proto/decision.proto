syntax = "proto3";
package iam.decision.v1;

// Contract between NestJS (caller) and the Rust core. v1 draft: the POC currently exposes the
// same shape over HTTP JSON (POST /v1/decide); gRPC (tonic) is planned.
message DecideRequest {
  string principal = 1;   // e.g. User::"demo-alice"
  string action = 2;
  string resource = 3;
  string context_json = 4;
  uint64 activation = 5;  // activation seq the decision must be evaluated against
}
message DecideResponse {
  bool allow = 1;
  repeated string reasons = 2;
  repeated string errors = 3;
  string commit = 4;      // data version (Dolt commit)
  uint64 activation = 5;
}
service Decision { rpc Decide(DecideRequest) returns (DecideResponse); }
